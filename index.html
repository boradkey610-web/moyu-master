<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#efe8d8"><title>摸鱼大师 · 今天也要准点下班</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="game-shell" aria-label="摸鱼大师游戏">
<header class="hud"><div class="hud-money"><span class="coin-icon" aria-hidden="true">¥</span><span class="hud-caption">金币</span><b id="money">0 <em>/ 100</em></b></div><span class="hud-divider"></span><div class="hud-clock"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="#fcfaf4" stroke="#447f9e" stroke-width="3"/><path d="M20 6v3m0 22v3M6 20h3m22 0h3" stroke="#52768a" stroke-width="2"/><path d="M20 11v10l7 4" fill="none" stroke="#465764" stroke-width="2.5" stroke-linecap="round"/><circle cx="20" cy="20" r="2" fill="#d8844b"/></svg><span class="hud-caption">下班</span><b id="time">02:00</b></div><button id="pause" class="icon-button" aria-label="暂停游戏"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6v12M16 6v12" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg></button><div class="progress" aria-hidden="true"><i id="progress"></i></div></header>
<section class="scene" aria-label="办公室地图"><canvas id="office" width="720" height="920" aria-label="六组办公桌和十二个工位"></canvas><div id="seat-buttons"></div><div class="scene-top"><span id="level-label">01 · 入职第一天</span><span id="mirror-status"></span></div><div id="toast" role="status"></div></section>
<footer class="controls"><div class="control-status" data-tone="work"><span id="state-label">认真工作中</span><span id="state-detail">选择一种摸鱼方式</span></div><div class="activity-row">
<button class="activity joke" data-activity="joke"><svg class="activity-icon" viewBox="0 0 52 52" aria-hidden="true"><path d="M16 8c-7 0-10 5-10 11v22l7-2 7 3h17c6 0 9-4 9-10V18c0-7-4-10-11-10z" fill="#fffaf0" stroke="#a46129" stroke-width="2"/><path d="M22 8c-1-6 8-7 9-3" fill="none" stroke="#ad6d36" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="19" cy="24" rx="3" ry="4" fill="#d78232"/><ellipse cx="34" cy="24" rx="3" ry="4" fill="#d78232"/><path d="M19 33q8 9 16-1" fill="#e6933a" stroke="#c3752c" stroke-width="2" stroke-linejoin="round"/></svg><strong>看段子</strong><small>+1 / 秒</small><span class="activity-risk">低风险 · 收手快</span></button>
<button class="activity game" data-activity="game"><svg class="activity-icon" viewBox="0 0 52 52" aria-hidden="true"><path d="M15 13c-6 0-9 5-11 15-2 9 0 14 5 14 4 0 7-6 10-7h14c4 1 7 7 11 7 5 0 7-5 5-14-2-10-5-15-11-15l-7 2H22z" fill="#fffaf7" stroke="#7052a4" stroke-width="2"/><path d="M15 21v12m-6-6h12" stroke="#9672d3" stroke-width="4" stroke-linecap="round"/><circle cx="36" cy="23" r="3" fill="#9d75da"/><circle cx="42" cy="29" r="3" fill="#9d75da"/><path d="M25 15v-5" stroke="#fffaf7" stroke-width="3"/></svg><strong>打游戏</strong><small>+3 / 秒</small><span class="activity-risk">中风险 · 收手 0.5 秒</span></button>
<button class="activity dance" data-activity="dance"><svg class="activity-icon" viewBox="0 0 52 52" aria-hidden="true"><path d="M26 3v8" stroke="#fff5f8" stroke-width="3"/><circle cx="26" cy="30" r="18" fill="#df6299" stroke="#fff8f4" stroke-width="2.5"/><ellipse cx="26" cy="30" rx="8" ry="18" fill="none" stroke="#fff8f4" stroke-width="2"/><path d="M9 24h34M9 35h34M26 12v36" stroke="#fff8f4" stroke-width="2"/><path d="m43 6 1.5 3.5L48 11l-3.5 1.5L43 16l-1.5-3.5L38 11l3.5-1.5z" fill="#fff7ea"/></svg><strong>蹦迪</strong><small>+6 / 秒</small><span class="activity-risk">高风险 · 收手 1 秒</span></button>
</div><button id="work" class="work-button"><svg viewBox="0 0 48 44" aria-hidden="true"><path d="M17 12V8c0-3 14-3 14 0v4" fill="none" stroke="currentColor" stroke-width="4"/><rect x="4" y="12" width="40" height="28" rx="5" fill="currentColor"/><path d="M4 23q20 11 40 0" fill="none" stroke="#59a56b" stroke-width="3"/><rect x="21" y="23" width="6" height="9" rx="2" fill="#59a56b"/></svg><span class="work-copy"><strong>一键工作</strong><small>随时收手</small></span></button>
<div class="tool-row"><button id="mirror"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="m19 21 5 8" stroke="#937450" stroke-width="5" stroke-linecap="round"/><ellipse cx="14" cy="12" rx="10" ry="11" fill="#c0e1e9" stroke="#8d8975" stroke-width="2"/><path d="m8 14 9-9m-5 14 8-8" stroke="#f1ffff" stroke-width="2"/></svg><span>反光镜</span><b id="mirror-count">0</b></button><button id="meeting"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="4" width="23" height="25" rx="3" fill="#f1dfb6" stroke="#9d8056" stroke-width="2"/><rect x="11" y="2" width="11" height="5" rx="2" fill="#bb9c6b"/><path d="M11 13h11m-11 5h11m-11 5h7" stroke="#a88c60" stroke-width="2" stroke-linecap="round"/></svg><span>开会</span><b id="meeting-count">0</b></button><button id="help"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="#fff8ec" stroke="#685b53" stroke-width="1.6"/><path d="m7 6 5 7m8 7 5 6M6 25l7-5m7-8 6-5" stroke="#e88678" stroke-width="7"/><circle cx="16" cy="16" r="7" fill="#fbf5e9" stroke="#685b53" stroke-width="1.5"/><circle cx="16" cy="16" r="13" fill="none" stroke="#685b53" stroke-width="1.5"/></svg><span>求助</span></button></div></footer>
<div id="overlay" class="overlay"><section id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"></section></div>
</main><script type="module" src="src/app.js"></script></body></html>
