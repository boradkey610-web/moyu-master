<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工位迪厅 · 视觉提案</title>
<style>
:root{color-scheme:dark;--paper:#f4e4bf;--muted:#a7b4ad;--gold:#ecc37f;--teal:#76c9c5;background:#111b20;color:var(--paper);font-family:Georgia,"Songti SC",serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 10%,#26413f88,transparent 55%),radial-gradient(ellipse at 0 80%,#5e3c292e,transparent 60%);min-height:100vh}
main{max-width:1120px;margin:auto;padding:28px;display:grid;grid-template-columns:290px minmax(0,620px);gap:42px;justify-content:center}.copy{padding-top:32px}.eyebrow{font:11px Georgia;letter-spacing:3px;color:var(--teal)}h1{font-size:38px;line-height:1.25;font-weight:500;margin:18px 0}p{font-size:14px;line-height:1.85;color:var(--muted)}.rule{height:1px;background:linear-gradient(90deg,#e5bb7588,transparent);margin:24px 0}button{width:100%;text-align:left;padding:13px 16px;margin:0 0 9px;border:1px solid #6d817b66;border-radius:5px;background:#24312e80;color:var(--paper);font-family:inherit;font-size:14px;cursor:pointer}button:hover{border-color:var(--gold)}button[aria-pressed=true]{background:#74604342;border-color:var(--gold)}a{color:var(--teal)}.stage{position:relative;align-self:start;border:1px solid #a9997255;border-radius:12px;overflow:hidden;box-shadow:0 24px 80px #0008;background:#172224}canvas{display:block;width:100%;height:auto}.caption{display:flex;justify-content:space-between;padding:12px 16px;font-size:12px;letter-spacing:1px;background:#142123}.caption span{color:var(--teal)}#status{font-size:11px;line-height:1.6;min-height:36px;color:var(--muted)}@media(max-width:760px){main{padding:16px;grid-template-columns:1fr;gap:18px}.copy{padding:0}h1{font-size:28px;margin:10px 0}.rule,.description{display:none}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{margin:0}.stage{max-width:620px;width:100%;margin:auto}}
</style>
<main>
<section class="copy"><div class="eyebrow">AFTER HOURS / VISUAL STUDY 03</div><h1>人在工位。<br>心在迪厅。</h1><p class="description">点击开始跳舞，办公室在 0.8 秒内渐变成迪厅；一键工作时，在 1 秒收手时间内渐回办公室。镜球、舞池、灯光和人物一起淡入淡出，场景没有顶部标题。</p><div class="rule"></div><div class="controls"><button id="mode" aria-pressed="false">开始跳舞 · 渐入迪厅</button><button id="size" aria-pressed="true">人物 1.3 倍 · 对比原尺寸</button><button id="warning" aria-pressed="false">演示「有人靠近」</button><button id="pause" aria-pressed="false">暂停观察舞姿</button></div><p>独立视觉提案，尚未替换正式游戏。<br>保留现有 28 帧八拍舞姿，无闪烁灯效。</p><p id="status" role="status">正在加载原始角色资源…</p><a href="dance-review.html">对比当前游戏效果 →</a></section>
<section class="stage"><canvas width="720" height="920" aria-label="办公室迪厅动态视觉预览"></canvas><div class="caption">工位迪厅 / 八拍循环 <span>CONCEPT ONLY</span></div></section>
</main>
<script type="module" src="./disco-review.js"></script>
</html>
