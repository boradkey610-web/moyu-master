<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>转弯回归检查</title><style>body{margin:0;background:#eee6d9;font:15px system-ui;color:#504536;display:flex;gap:18px;padding:16px}aside{width:280px}button{padding:10px 14px;margin:6px 0;border:1px solid #a89982;border-radius:8px;background:#fff9ed;color:inherit}canvas{height:calc(100vh - 32px);width:auto}pre{white-space:pre-wrap;line-height:1.7}</style><canvas id="review" width="720" height="920" aria-label="老板下行转弯测试场景"></canvas><aside><h2>下行 → 右转 → 下行 → 左转 → 上行</h2><button id="play">播放路线</button><button id="step">前进1秒</button><button id="reset">回到起点</button><pre id="state"></pre></aside><script type="module">
import {Game} from '../src/engine.js';import {Renderer} from '../src/render.js';
const canvas=document.querySelector('canvas'),r=new Renderer(canvas);await r.ready;let g,playing=false,last=0;
function reset(){g=new Game(2,123);g.npcs=[];g.inspectors=g.inspectors.slice(0,1);Object.assign(g.inspectors[0],{x:65,y:115,angle:Math.PI/2,queue:[{kind:'move',x:65,y:350},{kind:'move',x:355,y:350},{kind:'move',x:355,y:585},{kind:'move',x:65,y:585},{kind:'move',x:65,y:115},{kind:'wait',left:20,angle:-Math.PI/2}],hidden:false,hold:0});g.dropAt=999;g.specialAt=999;playing=false;render();}
function render(){r.draw(g,g.elapsed);const p=r.facings.get('boss'),i=g.inspectors[0];document.querySelector('#state').textContent=`时间：${g.elapsed.toFixed(1)}秒\n老板坐标：${i.x.toFixed(1)}, ${i.y.toFixed(1)}\n显示朝向：${{up:'向上 / 背面',down:'向下 / 正面',left:'向左 / 左侧',right:'向右 / 右侧'}[p]}\n当前动作：${i.queue[0].kind==='move'?'行走':'站定检查'}`;}
document.querySelector('#step').onclick=()=>{playing=false;g.step(1);render();};document.querySelector('#reset').onclick=reset;document.querySelector('#play').onclick=()=>playing=!playing;reset();function frame(now){if(playing&&last){g.step(Math.min(.05,(now-last)/1000));render();}last=now;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
