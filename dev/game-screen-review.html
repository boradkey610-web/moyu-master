<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>电脑打游戏 · 屏幕覆盖预览</title>
<style>
:root{font-family:Georgia,"Songti SC",serif;background:#eee4cf;color:#514c3d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 0 0,#fff9eb,transparent 65%);min-height:100vh}main{max-width:1160px;margin:auto;padding:26px}header{max-width:780px;margin-bottom:22px}.eyebrow{font-size:11px;letter-spacing:3px;color:#6c8276}h1{font-size:30px;font-weight:500;margin:12px 0}p{line-height:1.7;font-size:14px}button,select,a{font:inherit;color:#5a5644}button,select{padding:10px 14px;border:1px solid #a2977d;border-radius:5px;background:#fff7e8;margin:0 6px 8px 0;cursor:pointer}button[aria-pressed=true]{background:#486d64;color:#fff3cf;border-color:#486d64}.layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:start}.panel{border:1px solid #b4a78c;border-radius:9px;overflow:hidden;background:#fff6e6;box-shadow:0 12px 34px #7a664718}.label{padding:12px 16px;font-size:13px;border-bottom:1px solid #c4b79d}canvas{display:block;width:100%;height:auto}.note{padding:0 16px;font-size:13px;color:#817659}#status{font-size:12px;color:#687c6f}a{color:#406a64}@media(max-width:740px){main{padding:16px}.layout{grid-template-columns:1fr}h1{font-size:25px}.office{max-height:65vh;width:auto;max-width:100%;margin:auto}}
</style>
<main><header><div class="eyebrow">COMPUTER GAMING / TYPING STUDY</div><h1>手在敲键盘，屏幕里偷偷赛车。</h1><p>GPT-Image-2 生成 6 张按键姿势，组成 1 秒往返循环。头、身体和腿保持不动，双手与前臂交替按键。左侧放大查看，右侧是游戏实际尺寸；仍然只覆盖选中工位的屏幕。</p><button id="toggle" aria-pressed="true">游戏屏幕 · 查看原图</button><button id="typing" aria-pressed="true">敲键盘 · 对比静态姿势</button><button id="pause" aria-pressed="false">暂停观察</button><button id="slow" aria-pressed="false">慢速查看</button><button id="step">逐帧查看</button><label>工位 <select id="seat" aria-label="选择预览工位"></select></label><a href="../">正式游戏</a><p id="status" role="status">正在加载桌子与人物素材…</p></header><div class="layout"><section class="panel"><div class="label">工位放大 / 按键与屏幕</div><canvas id="detail" width="900" height="760" aria-label="工位敲键盘动作放大预览"></canvas><p class="note">仅为独立预览，尚未替换正式游戏。可慢速、暂停或逐帧查看，没有重绘桌子。</p></section><section class="panel"><div class="label">实际办公室 / 只改变选中工位</div><canvas class="office" id="office" width="720" height="920" aria-label="游戏原尺寸下的电脑游戏与敲键盘动画"></canvas></section></div></main>
<script type="module" src="./game-screen-review.js"></script>
</html>
